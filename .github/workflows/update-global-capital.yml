name: Update global capital data
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-capital-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate World Bank data
        run: python scripts/update_global_capital.py
      - name: Commit only if values changed
        run: |
          git add public/data/global-capital.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh global capital statistics"
          git push
